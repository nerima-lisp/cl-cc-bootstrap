site_name: cl-cc-bootstrap
site_description: Pre-interned bootstrap symbols and the backend registration protocol for the cl-cc Common Lisp compiler
site_url: https://nerima-lisp.github.io/cl-cc-bootstrap/
repo_url: https://github.com/nerima-lisp/cl-cc-bootstrap
docs_dir: src
site_dir: ../site

# Also passed as --strict by packages.docs. Writing it here as well means
# `mkdocs serve` applies the same gate, so no invocation path silently
# tolerates a broken link. Use `mkdocs serve --no-strict` while editing.
strict: true

theme:
  name: material

plugins:
  - search

# Every page under docs/src/ must appear here: --strict fails the build on an
# unlisted page. The five sections and the guide/ reference/ project/ split
# are fixed by DOCS_STANDARD.md; there is no guide/ page yet, so that section
# is omitted rather than stubbed.
nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - Reference:
      - API: reference/api.md
  - Project:
      - Development: project/development.md

not_in_nav: |
  notes/
